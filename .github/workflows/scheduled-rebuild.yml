# Rebuild diário — faz os posts agendados entrarem no ar sozinhos.
#
# Por que este workflow existe:
#   src/pages/blog/index.astro e src/pages/blog/[...slug].astro filtram
#   `pubDate <= now`. Esse `now` é o instante do BUILD, não o instante da visita.
#   Como o site é estático e o deploy da Cloudflare Pages só dispara em push,
#   um post com pubDate futura NUNCA aparecia sozinho: ficava esperando alguém
#   fazer um commit qualquer. Este cron dispara um deploy novo todo dia, e é o
#   build novo que "libera" os posts cuja data já chegou.
#
#   Até 01/2026 havia um cron no publish.yml do GitHub Pages que fazia esse
#   papel sem que ninguém percebesse. Ele saiu na migração para a Cloudflare e
#   o filtro `pubDate <= now` ficou órfão desde então.
#
# Mecanismo: API da Cloudflare (POST /pages/projects/<projeto>/deployments).
#   Escolhida em vez do Deploy Hook porque o hook exige criação manual no
#   painel, enquanto o API token já existe e é reaproveitável. O deploy em si
#   continua sendo o mesmo da integração git — este arquivo não muda nada de
#   como o site é construído.
#
# PRÉ-REQUISITO (uma vez): dois secrets no GitHub
#   Settings > Secrets and variables > Actions > New repository secret
#     CLOUDFLARE_API_TOKEN    token com permissão Cloudflare Pages: Edit
#     CLOUDFLARE_ACCOUNT_ID   bf37a8c9cc1728597f782f507eeff866
#   Enquanto os secrets não existirem, o job falha com mensagem explícita (de
#   propósito: falha silenciosa aqui significaria post agendado que nunca sai).

name: Rebuild agendado

on:
  schedule:
    # 09:00 UTC = 06:00 BRT — janela pedida para o post do dia.
    - cron: "0 9 * * *"
    # 11:00 UTC = 08:00 BRT — rede de segurança: os posts do repo usam
    # `pubDate: ...T10:00:00.000Z`, que ainda é futuro às 09:00 UTC.
    # Sem esta segunda passada, um post datado 10:00Z só sairia no dia seguinte.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-rebuild
  cancel-in-progress: false

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy na Cloudflare Pages
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: tabela-do-inss
          CF_BRANCH: master
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKEN}" ] || [ -z "${CF_ACCOUNT}" ]; then
            echo "::error::Secrets CLOUDFLARE_API_TOKEN e/ou CLOUDFLARE_ACCOUNT_ID ausentes."
            echo "Sem eles o post agendado nunca entra no ar. Ver .github/AGENDAMENTO.md"
            exit 1
          fi
          status=$(curl -sS -o /tmp/cf.json -w '%{http_code}' \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${CF_PROJECT}/deployments" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -F "branch=${CF_BRANCH}")
          echo "HTTP ${status}"
          # o corpo traz id e url do deployment; não expõe segredo
          python3 -c "
          import json,sys
          d=json.load(open('/tmp/cf.json'))
          if not d.get('success'):
              print('::error::Cloudflare recusou:', json.dumps(d.get('errors'))[:300]); sys.exit(1)
          r=d['result']
          print('Deploy', r['id'], '->', r.get('url'))
          "
